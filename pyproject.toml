[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "straysifter"
version = "2.1.0"
description = "Сборщик публичных VPN-ключей (vless, vmess, trojan, ss, socks, http, mtproto, hysteria2) с TCP/TLS-отсевом и GeoIP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "bot & stupid" }]
keywords = [
    "vpn", "vless", "vmess", "trojan", "shadowsocks",
    "hysteria2", "mtproto", "socks5", "proxy", "collector",
    "geoip", "reality", "xray", "sing-box",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Utilities",
]

dependencies = [
    "requests[socks]>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
geoip = ["maxminddb>=1.6"]
dev = ["ruff>=0.1", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/Normone/Stray-Keys-Sifter"
Source = "https://github.com/Normone/Stray-Keys-Sifter"
Issues = "https://github.com/Normone/Stray-Keys-Sifter/issues"

[project.scripts]
straysifter         = "straysifter.frontends.cli:main"
straysifter-service = "straysifter.service.__main__:main"

[tool.setuptools.packages.find]
include = ["straysifter*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]